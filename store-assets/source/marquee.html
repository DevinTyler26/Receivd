<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receivd marquee promotional tile</title>
    <link rel="stylesheet" href="./showcase.css">
  </head>
  <body class="marquee-body">
    <main class="marquee-tile">
      <div class="marquee-brand">
        <img alt="" src="/icon-128.png">
        <div>
          <p class="marquee-eyebrow">Receivd · TCG Order Tracker</p>
          <h1>Know what arrived.<br>Catch what didn’t.</h1>
          <p class="marquee-copy">Track delivered, partial, missing, refunded, and overdue TCGplayer orders—down to each card.</p>
        </div>
      </div>
      <div aria-hidden="true" class="marquee-statuses">
        <span class="status-delivered">✓ Delivered</span>
        <span class="status-partial">● Partial</span>
        <span class="status-missing">● Missing</span>
      </div>
    </main>
  </body>
</html>
